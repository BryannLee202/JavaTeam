# =============================================================================
# SHMS — bốn service chạy bằng Docker
# =============================================================================
# Thứ tự khởi động do healthcheck quyết định, không do thứ tự khai báo:
#   postgres → backend → bff → frontend
#
# Mỗi service đều có:
#   deploy.resources.limits   chặn một service ăn hết RAM/CPU của máy
#   logging.options           chặn file log phình vô hạn
#
# Hai thứ này trước đây không có. Một vòng lặp lỗi trong backend có thể sinh
# hàng GB log và làm đầy ổ đĩa — trên máy demo thì hỏng cả buổi.
#
# Chạy:  docker compose up --build
# Dừng:  docker compose down          (giữ dữ liệu)
#        docker compose down -v       (xoá luôn dữ liệu)
# =============================================================================

x-logging: &ghi-log
  # Giữ tối đa 2 file × 10 MB cho mỗi service. Quá thì Docker tự xoay vòng,
  # log cũ nhất bị bỏ. Không đặt thì file log lớn không giới hạn.
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "2"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seal_hackathon
      POSTGRES_USER: seal_admin
      POSTGRES_PASSWORD: seal_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seal_admin -d seal_hackathon"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    logging: *ghi-log

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/seal_hackathon
      DB_USERNAME: seal_admin
      DB_PASSWORD: seal_password
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a root .env file first — see .env.example}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1024M
    logging: *ghi-log

  bff:
    build: ./bff
    environment:
      PORT: 4000
      BACKEND_URL: http://backend:8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 384M
    logging: *ghi-log

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BFF_URL: http://localhost:4000
    ports:
      - "3000:80"
    depends_on:
      bff:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    logging: *ghi-log

volumes:
  postgres_data:
