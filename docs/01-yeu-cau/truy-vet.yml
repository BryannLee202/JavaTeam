# Nguồn sự thật cho ma trận truy vết yêu cầu.
#
# Mỗi use case trong SRS khai ở đây kèm ĐƯỜNG DẪN THẬT tới code và test thực
# hiện nó. File markdown `ma-tran-truy-vet.md` sinh ra từ file này — đừng sửa
# file markdown, sửa ở đây rồi chạy:
#
#     node scripts/sinh-ma-tran-truy-vet.mjs
#
# CI gọi script này với cờ --check. Nếu một đường dẫn dưới đây không còn tồn
# tại (đổi tên, xoá, gộp file) thì CI HỎNG. Nhờ vậy bảng không thể mục dần mà
# không ai biết — đây là điểm khác với cách viết bảng bằng tay.
#
# trang_thai:
#   xong         — làm đủ, có code chạy được
#   mot_phan     — có phần chính nhưng còn thiếu nhánh phụ SRS mô tả
#   chua_lam     — chưa có dòng code nào

meta:
  nguon: docs/01-yeu-cau/SRS.md
  kiem_lan_cuoi: "2026-09-15"

