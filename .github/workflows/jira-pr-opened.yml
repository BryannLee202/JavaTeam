# =============================================================================
# Jira ↔ GitHub Automation: PR Opened / Edited
# =============================================================================
# Trigger: Khi tạo PR mới hoặc edit PR (title chứa JAV-xxx)
# Actions:
#   1. Chuyển Jira issue → "In Review"
#   2. Comment link PR lên Jira issue
# =============================================================================

name: "Jira: PR → In Review"

on:
  pull_request:
    types: [opened, edited]
    branches:
      - frontend
      - main

permissions:
  pull-requests: read

jobs:
  transition-jira:
    name: Move Jira issue to In Review
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Extract Jira key from branch name or PR title
      # -----------------------------------------------------------------------
      - name: Extract Jira issue key
        id: jira
        run: |
          BRANCH="${{ github.head_ref }}"
          PR_TITLE="${{ github.event.pull_request.title }}"

          # Try branch name first, then PR title
          JIRA_KEY=$(echo "$BRANCH" | grep -oEi 'JAV-[0-9]+' | head -1 | tr '[:lower:]' '[:upper:]')
          if [ -z "$JIRA_KEY" ]; then
            JIRA_KEY=$(echo "$PR_TITLE" | grep -oEi 'JAV-[0-9]+' | head -1 | tr '[:lower:]' '[:upper:]')
          fi

          if [ -z "$JIRA_KEY" ]; then
            echo "⚠️ No Jira key (JAV-xxx) found in branch '$BRANCH' or PR title '$PR_TITLE'"
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "✅ Found Jira key: $JIRA_KEY"
          echo "key=$JIRA_KEY" >> $GITHUB_OUTPUT
          echo "found=true" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # Step 2: Get available transitions and find "In Review"
      # -----------------------------------------------------------------------
      - name: Get Jira transitions
        if: steps.jira.outputs.found == 'true'
        id: transitions
        run: |
          JIRA_KEY="${{ steps.jira.outputs.key }}"

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -u "${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.JIRA_BASE_URL }}/rest/api/3/issue/${JIRA_KEY}/transitions")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Failed to get transitions (HTTP $HTTP_CODE): $BODY"
            exit 1
          fi

          # Find transition ID for "In Review" (case insensitive)
          TRANSITION_ID=$(echo "$BODY" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for t in data.get('transitions', []):
              if t['name'].lower().strip() == 'in review':
                  print(t['id'])
                  break
          " 2>/dev/null)

          if [ -z "$TRANSITION_ID" ]; then
            echo "⚠️ 'In Review' transition not found. Available transitions:"
            echo "$BODY" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for t in data.get('transitions', []):
              print(f\"  - {t['name']} (id: {t['id']})\")
          " 2>/dev/null
            echo "transition_found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "✅ Found 'In Review' transition ID: $TRANSITION_ID"
          echo "transition_id=$TRANSITION_ID" >> $GITHUB_OUTPUT
          echo "transition_found=true" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # Step 3: Transition issue to "In Review"
      # -----------------------------------------------------------------------
      - name: Transition to In Review
        if: steps.jira.outputs.found == 'true' && steps.transitions.outputs.transition_found == 'true'
        run: |
          JIRA_KEY="${{ steps.jira.outputs.key }}"
          TRANSITION_ID="${{ steps.transitions.outputs.transition_id }}"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -u "${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"transition\": {\"id\": \"${TRANSITION_ID}\"}}" \
            "${{ secrets.JIRA_BASE_URL }}/rest/api/3/issue/${JIRA_KEY}/transitions")

          if [ "$HTTP_CODE" = "204" ]; then
            echo "✅ $JIRA_KEY → In Review"
          else
            echo "❌ Failed to transition (HTTP $HTTP_CODE)"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Step 4: Add comment with PR link on Jira issue
      # -----------------------------------------------------------------------
      - name: Comment PR link on Jira
        if: steps.jira.outputs.found == 'true'
        run: |
          JIRA_KEY="${{ steps.jira.outputs.key }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"

          # Atlassian Document Format (ADF) for Jira Cloud
          COMMENT_BODY=$(cat <<EOF
          {
            "body": {
              "version": 1,
              "type": "doc",
              "content": [
                {
                  "type": "paragraph",
                  "content": [
                    {"type": "text", "text": "🔀 "},
                    {"type": "text", "text": "Pull Request #${PR_NUMBER}", "marks": [{"type": "strong"}]},
                    {"type": "text", "text": " opened by "},
                    {"type": "text", "text": "${PR_AUTHOR}", "marks": [{"type": "strong"}]}
                  ]
                },
                {
                  "type": "paragraph",
                  "content": [
                    {"type": "text", "text": "📎 "},
                    {"type": "text", "text": "${PR_TITLE}", "marks": [{"type": "link", "attrs": {"href": "${PR_URL}"}}]}
                  ]
                }
              ]
            }
          }
          EOF
          )

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -u "${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$COMMENT_BODY" \
            "${{ secrets.JIRA_BASE_URL }}/rest/api/3/issue/${JIRA_KEY}/comment")

          if [ "$HTTP_CODE" = "201" ]; then
            echo "✅ Commented PR link on $JIRA_KEY"
          else
            echo "⚠️ Failed to add comment (HTTP $HTTP_CODE)"
          fi
