# =============================================================================
# Jira ↔ GitHub Automation: PR → "In Review"
# =============================================================================
# Tim TAT CA ma JAV-xxx trong ten nhanh, tieu de PR va commit message, roi
# chuyen tung issue sang "In Review" kem comment.
#
# Truoc day dung 'head -1' nen PR chua nhieu ma chi cap nhat duoc ma dau tien
# — vi du PR co "JAV-13 + JAV-15 + JAV-12" thi chi JAV-13 duoc chuyen, hai ma
# con lai ket trang thai cu du code da vao main.
# =============================================================================

name: "Jira: PR → In Review"

on:
  pull_request:
    types: [opened, edited]
    branches:
      - frontend
      - main

permissions:
  pull-requests: read

jobs:
  transition-jira:
    name: Move Jira issue to In Review
    runs-on: ubuntu-latest

    steps:
      - name: Tim tat ca ma Jira
        id: jira
        env:
          BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          COMMITS=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$REPO/pulls/$PR_NUMBER/commits?per_page=100" \
            | jq -r '.[].commit.message' 2>/dev/null || echo "")

          KEYS=$(printf '%s\n%s\n%s' "$BRANCH" "$PR_TITLE" "$COMMITS" \
            | grep -oEi 'JAV-[0-9]+' | tr '[:lower:]' '[:upper:]' | sort -u | tr '\n' ' ' | sed 's/ $//')

          if [ -z "$KEYS" ]; then
            echo "::warning title=Khong tim thay ma Jira::Khong co JAV-xxx trong ten nhanh, tieu de PR hay commit message. Khong task nao duoc chuyen sang In Review."
            {
              echo "### ⚠️ Khong chuyen duoc task nao sang In Review"
              echo ""
              echo "Khong tim thay ma \`JAV-xxx\`. Dat ten nhanh dang \`JAV-20-mo-ta\` hoac tieu de PR dang \`[JAV-20] Mo ta\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Tim thay: $KEYS"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "keys=$KEYS" >> "$GITHUB_OUTPUT"

      - name: Chuyen trang thai va comment
        if: steps.jira.outputs.found == 'true'
        env:
          KEYS: ${{ steps.jira.outputs.keys }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TARGET: "In Review"
        run: |
          set -uo pipefail
          echo "| Task | Chuyen trang thai | Comment |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          for KEY in $KEYS; do
            TR=$(curl -sS -u "$EMAIL:$TOKEN" -H "Accept: application/json" \
              "$BASE_URL/rest/api/3/issue/$KEY/transitions")
            TID=$(echo "$TR" | jq -r --arg t "$TARGET" \
              '[(.transitions // [])[] | select(.name | ascii_downcase == ($t | ascii_downcase))][0].id // empty')

            if [ -z "$TID" ]; then
              echo "::warning::$KEY khong co transition '$TARGET'. Dang co: $(echo "$TR" | jq -r '[(.transitions // [])[].name] | join(", ")')"
              MOVED="⚠️ khong co transition"
            else
              C=$(curl -sS -o /dev/null -w "%{http_code}" -X POST -u "$EMAIL:$TOKEN" \
                -H "Content-Type: application/json" -d "{\"transition\":{\"id\":\"$TID\"}}" \
                "$BASE_URL/rest/api/3/issue/$KEY/transitions")
              [ "$C" = "204" ] && MOVED="✅ → $TARGET" || MOVED="❌ HTTP $C"
              echo "$KEY: $MOVED"
            fi

            BODY=$(python3 - <<'PY'
          import json, os
          print(json.dumps({"body": {"version": 1, "type": "doc", "content": [
            {"type": "paragraph", "content": [
              {"type": "text", "text": os.environ["TARGET"] + " — "},
              {"type": "text", "text": "PR #" + os.environ["PR_NUMBER"], "marks": [{"type": "strong"}]},
              {"type": "text", "text": " boi " + os.environ["PR_AUTHOR"]}]},
            {"type": "paragraph", "content": [
              {"type": "text", "text": os.environ["PR_TITLE"],
               "marks": [{"type": "link", "attrs": {"href": os.environ["PR_URL"]}}]}]}]}}))
          PY
          )
            CC=$(curl -sS -o /dev/null -w "%{http_code}" -X POST -u "$EMAIL:$TOKEN" \
              -H "Content-Type: application/json" -d "$BODY" \
              "$BASE_URL/rest/api/3/issue/$KEY/comment")
            [ "$CC" = "201" ] && CMT="✅" || CMT="❌ $CC"

            echo "| $KEY | $MOVED | $CMT |" >> "$GITHUB_STEP_SUMMARY"
          done
