# =============================================================================
# Jira ↔ GitHub Automation: Branch Created
# =============================================================================
# Đặt file này tại: .github/workflows/jira-branch-created.yml
#
# Trigger: khi có nhánh mới được tạo (tên nhánh chứa JAV-xxx)
# Action : chuyển Jira issue → "In Progress" + comment tên nhánh lên issue
#
# Workflow này gọi thẳng Jira REST API nên KHÔNG cần app "GitHub for Atlassian",
# KHÔNG cần quyền site admin bên Jira. Chỉ cần 3 secret trong repo:
#   JIRA_BASE_URL   = https://taileminh2202-1784732251525.atlassian.net
#   JIRA_USER_EMAIL = taileminh2202@gmail.com
#   JIRA_API_TOKEN  = token tạo tại id.atlassian.com/manage-profile/security/api-tokens
# =============================================================================

name: "Jira: Branch → In Progress"

on:
  create

permissions:
  contents: read

jobs:
  transition-jira:
    name: Move Jira issue to In Progress
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Lấy mã Jira từ tên nhánh
      # -----------------------------------------------------------------------
      - name: Extract Jira issue key
        id: jira
        run: |
          BRANCH="${{ github.event.ref }}"

          JIRA_KEY=$(echo "$BRANCH" | grep -oEi 'JAV-[0-9]+' | head -1 | tr '[:lower:]' '[:upper:]')

          if [ -z "$JIRA_KEY" ]; then
            echo "⚠️ Nhánh '$BRANCH' không có mã JAV-xxx — bỏ qua"
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "✅ Tìm thấy mã Jira: $JIRA_KEY"
          echo "key=$JIRA_KEY" >> $GITHUB_OUTPUT
          echo "found=true" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # Step 2: Tìm transition "In Progress"
      # -----------------------------------------------------------------------
      - name: Get Jira transitions
        if: steps.jira.outputs.found == 'true'
        id: transitions
        run: |
          JIRA_KEY="${{ steps.jira.outputs.key }}"

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -u "${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.JIRA_BASE_URL }}/rest/api/3/issue/${JIRA_KEY}/transitions")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Không lấy được transitions (HTTP $HTTP_CODE): $BODY"
            exit 1
          fi

          TRANSITION_ID=$(echo "$BODY" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for t in data.get('transitions', []):
              if t['name'].lower().strip() == 'in progress':
                  print(t['id'])
                  break
          " 2>/dev/null)

          if [ -z "$TRANSITION_ID" ]; then
            echo "⚠️ Không thấy transition 'In Progress'. Các transition đang có:"
            echo "$BODY" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for t in data.get('transitions', []):
              print(f\"  - {t['name']} (id: {t['id']})\")
          " 2>/dev/null
            echo "transition_found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "✅ transition 'In Progress' id = $TRANSITION_ID"
          echo "transition_id=$TRANSITION_ID" >> $GITHUB_OUTPUT
          echo "transition_found=true" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # Step 3: Chuyển issue sang "In Progress"
      # -----------------------------------------------------------------------
      - name: Transition to In Progress
        if: steps.jira.outputs.found == 'true' && steps.transitions.outputs.transition_found == 'true'
        run: |
          JIRA_KEY="${{ steps.jira.outputs.key }}"
          TRANSITION_ID="${{ steps.transitions.outputs.transition_id }}"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -u "${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"transition\": {\"id\": \"${TRANSITION_ID}\"}}" \
            "${{ secrets.JIRA_BASE_URL }}/rest/api/3/issue/${JIRA_KEY}/transitions")

          if [ "$HTTP_CODE" = "204" ]; then
            echo "✅ $JIRA_KEY → In Progress"
          else
            echo "❌ Chuyển trạng thái thất bại (HTTP $HTTP_CODE)"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Step 4: Comment tên nhánh lên Jira issue
      # -----------------------------------------------------------------------
      - name: Comment branch on Jira
        if: steps.jira.outputs.found == 'true'
        run: |
          JIRA_KEY="${{ steps.jira.outputs.key }}"
          BRANCH="${{ github.event.ref }}"
          ACTOR="${{ github.actor }}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}/tree/${{ github.event.ref }}"

          COMMENT_BODY=$(cat <<EOF
          {
            "body": {
              "version": 1,
              "type": "doc",
              "content": [
                {
                  "type": "paragraph",
                  "content": [
                    {"type": "text", "text": "🌿 "},
                    {"type": "text", "text": "${ACTOR}", "marks": [{"type": "strong"}]},
                    {"type": "text", "text": " vua tao nhanh "},
                    {"type": "text", "text": "${BRANCH}", "marks": [{"type": "link", "attrs": {"href": "${REPO_URL}"}}]}
                  ]
                }
              ]
            }
          }
          EOF
          )

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -u "${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$COMMENT_BODY" \
            "${{ secrets.JIRA_BASE_URL }}/rest/api/3/issue/${JIRA_KEY}/comment")

          if [ "$HTTP_CODE" = "201" ]; then
            echo "✅ Đã comment tên nhánh lên $JIRA_KEY"
          else
            echo "⚠️ Comment thất bại (HTTP $HTTP_CODE)"
          fi
