# =============================================================================
# Jira ↔ GitHub: gan link GitHub vao task Jira
# =============================================================================
# Muc dich: task Jira hien muc "Links" tro thang toi nhanh / Pull Request tren
# GitHub — thay cho panel Development (panel do can app GitHub for Atlassian,
# cai rieng trong Jira: Apps -> Explore more apps -> "GitHub for Jira").
#
# Chay khi: tao nhanh moi, mo PR, cap nhat PR, dong/merge PR.
# Dung globalId nen link duoc ghi de, khong bi trung lap.
#
# Tim ma JAV-xxx trong: ten nhanh, tieu de PR, va DONG DAU cua moi commit.
# Chi lay dong dau vi than commit thuong nhac ten ma khac de giai thich —
# quet ca than se gan link nham vao task khong lien quan.
# Nhan NHIEU ma trong cung mot PR, khong chi lay ma dau tien.
# Khong tim thay ma nao thi bao warning ro rang chu khong im lang bo qua.
#
# Dung chung 3 secret voi cac workflow khac:
#   JIRA_BASE_URL / JIRA_USER_EMAIL / JIRA_API_TOKEN
# =============================================================================

name: "Jira: Gan link GitHub vao task"

on:
  create:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  link:
    name: Gan remote link len Jira
    runs-on: ubuntu-latest

    steps:
      - name: Xac dinh ma Jira va link
        id: ctx
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.event.ref_type }}
          CREATED_REF: ${{ github.event.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_STATE: ${{ github.event.pull_request.state }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          if [ "$EVENT_NAME" = "create" ]; then
            if [ "$REF_TYPE" != "branch" ]; then
              echo "Khong phai branch — bo qua"
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            SOURCE="$CREATED_REF"
            URL="$SERVER/$REPO/tree/$CREATED_REF"
            TITLE="Nhanh: $CREATED_REF"
            GID_PREFIX="github-branch-$CREATED_REF"
            REL="branch"
            WHERE="ten nhanh"
          else
            # Quet ca commit message trong PR, khong chi ten nhanh va tieu de.
            COMMITS=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$REPO/pulls/$PR_NUMBER/commits?per_page=100" \
              | jq -r '.[].commit.message | split("\n")[0]' 2>/dev/null || echo "")
            SOURCE="$PR_HEAD
          $PR_TITLE
          $COMMITS"
            URL="$PR_URL"
            GID_PREFIX="github-pr-$PR_NUMBER"
            REL="pull request"
            WHERE="ten nhanh, tieu de PR hoac commit message"
            if [ "$PR_MERGED" = "true" ]; then
              TITLE="Da merge PR #$PR_NUMBER: $PR_TITLE"
            elif [ "$PR_STATE" = "closed" ]; then
              TITLE="Da dong PR #$PR_NUMBER: $PR_TITLE"
            else
              TITLE="PR #$PR_NUMBER: $PR_TITLE"
            fi
          fi

          # Lay TAT CA ma JAV, khu trung lap. Truoc day dung head -1 nen PR co
          # nhieu ma chi cap nhat duoc ma dau tien.
          KEYS=$(echo "$SOURCE" | grep -oEi 'JAV-[0-9]+' | tr '[:lower:]' '[:upper:]' | sort -u | tr '\n' ' ' | sed 's/ $//')

          if [ -z "$KEYS" ]; then
            echo "::warning title=Khong noi duoc voi Jira::Khong tim thay ma JAV-xxx trong $WHERE. Task Jira se KHONG hien link toi thay doi nay."
            {
              echo "### ⚠️ Khong gan duoc link len Jira"
              echo ""
              echo "Khong tim thay ma \`JAV-xxx\` trong $WHERE."
              echo ""
              echo "Dat ten theo dung quy uoc thi Jira moi noi duoc:"
              echo ""
              echo "| Cho | Dung | Sai |"
              echo "|---|---|---|"
              echo "| Nhanh | \`JAV-20-cham-diem\` | \`feature/cham-diem\` |"
              echo "| Tieu de PR | \`[JAV-20] Cham diem\` | \`Them man cham diem\` |"
              echo "| Commit | \`JAV-20: them ScoreService\` | \`feat: them service\` |"
              echo ""
              echo "Chi can MOT trong ba cho tren co ma la du."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Tim thay ma Jira: $KEYS"
          {
            echo "ok=true"
            echo "keys=$KEYS"
            echo "url=$URL"
            echo "title=$TITLE"
            echo "gid_prefix=$GID_PREFIX"
            echo "rel=$REL"
          } >> "$GITHUB_OUTPUT"

      - name: Gui remote link len Jira
        if: steps.ctx.outputs.ok == 'true'
        env:
          JIRA_KEYS: ${{ steps.ctx.outputs.keys }}
          LINK_URL: ${{ steps.ctx.outputs.url }}
          LINK_TITLE: ${{ steps.ctx.outputs.title }}
          GID_PREFIX: ${{ steps.ctx.outputs.gid_prefix }}
          LINK_REL: ${{ steps.ctx.outputs.rel }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          set -uo pipefail

          echo "| Task Jira | Ket qua |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          FAILED=0
          for KEY in $JIRA_KEYS; do
            PAYLOAD=$(LINK_GID="$GID_PREFIX-$KEY" python3 - <<'PY'
          import json, os
          print(json.dumps({
            "globalId": os.environ["LINK_GID"],
            "relationship": os.environ["LINK_REL"],
            "application": {"type": "com.github", "name": "GitHub"},
            "object": {
              "url": os.environ["LINK_URL"],
              "title": os.environ["LINK_TITLE"],
              "icon": {
                "url16x16": "https://github.githubassets.com/favicons/favicon.png",
                "title": "GitHub"
              }
            }
          }))
          PY
          )
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
              -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$JIRA_BASE_URL/rest/api/3/issue/$KEY/remotelink")

            if [ "$CODE" = "200" ] || [ "$CODE" = "201" ]; then
              echo "✅ $KEY da gan link"
              echo "| $KEY | ✅ da gan link |" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$CODE" = "404" ]; then
              # Ma duoc nhac toi nhung issue khong ton tai (vd go nham so).
              # Canh bao thoi, khong lam do ca job.
              echo "::warning title=Issue khong ton tai::$KEY khong co tren Jira — bo qua"
              echo "| $KEY | ⚠️ khong ton tai |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error title=Gan link that bai::$KEY tra ve HTTP $CODE"
              echo "| $KEY | ❌ HTTP $CODE |" >> "$GITHUB_STEP_SUMMARY"
              FAILED=1
            fi
          done

          exit $FAILED
