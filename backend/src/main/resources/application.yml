server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: coordinator-service

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

  datasource:
    url: ${DB_URL:jdbc:h2:mem:hackathon;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: ${FLYWAY_ENABLED:false}

  h2:
    console:
      enabled: ${H2_CONSOLE:true}
      path: /h2-console

app:
  jwt:
    secret: ${APP_JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1jaGFuZ2UtbWUtMzJieXRl}
    access-token-expiration-ms: ${APP_JWT_ACCESS_TTL:900000}
    refresh-token-expiration-ms: ${APP_JWT_REFRESH_TTL:604800000}

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    com.seal.hackathon: ${LOG_LEVEL:INFO}