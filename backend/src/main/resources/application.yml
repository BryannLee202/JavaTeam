spring:
  application:
    name: hackathon-backend

  # Mac dinh chay H2 trong bo nho de ai clone ve cung chay duoc ngay, khong can cai DB.
  # Chay voi Postgres that: dat bien moi truong DB_URL / DB_USERNAME / DB_PASSWORD.
  datasource:
    url: ${DB_URL:jdbc:h2:mem:hackathon;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      # update: du cho giai doan dung schema. Khi co du bo migration Flyway
      # thi doi thanh validate va bat flyway o duoi.
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    # Tat vi repo chua co du bo migration V1..V5 (hien chi co V6 tu nhanh BE-cham-diem).
    # Bat lai khi bo migration da day du.
    enabled: ${FLYWAY_ENABLED:false}

  h2:
    console:
      enabled: ${H2_CONSOLE:false}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # CHI DE CHAY LOCAL. Tren moi truong that PHAI dat bien APP_JWT_SECRET.
    # Gia tri la chuoi Base64 cua khoa 32 byte (HS256 yeu cau toi thieu 256 bit).
    secret: ${APP_JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1jaGFuZ2UtbWUtMzJieXRl}
    access-token-expiration-ms: ${APP_JWT_ACCESS_TTL:900000}      # 15 phut
    refresh-token-expiration-ms: ${APP_JWT_REFRESH_TTL:604800000} # 7 ngay
  cors:
    # Vite dev server. Nhieu origin thi ngan cach bang dau phay.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.seal.hackathon: ${LOG_LEVEL:INFO}
