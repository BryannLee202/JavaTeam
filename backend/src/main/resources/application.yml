server:
  port: 8080

spring:
  application:
    name: coordinator-service

  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  datasource:
    url: jdbc:h2:mem:coordinator;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

# CORS is intentionally wide open here — in the real topology only the BFF
# calls this service directly, so lock this down to the BFF's origin once
# that's deployed.
app:
  cors:
    allowed-origins: "*"
