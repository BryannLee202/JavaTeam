spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false

# Reduce logging noise during tests
logging:
  level:
    root: INFO
    org.springframework: WARN
    com.seal.hackathon: DEBUG

# Application properties required by some beans during test startup
app:
  cors:
    allowed-origins: "*"
  jwt:
    # Base64-encoded secret (must be valid Base64 for JwtService)
    # 256-bit (32-byte) Base64 secret: decodes to 32 bytes of 'a' (0x61)
    secret: "YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE="
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 86400000
